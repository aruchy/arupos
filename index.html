<!DOCTYPE html>
<html lang="id" data-theme="light" data-accent="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ECEAE6">
  <meta name="description" content="AruPOS - Aplikasi kasir digital serbaguna untuk HP dan tablet, mendukung mode Retail dan F&amp;B secara offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>AruPOS - Kasir Digital Offline</title>
  <script>
    (function () {
      try {
        var raw = window.localStorage.getItem('arupos_v1_settings');
        var s = raw ? JSON.parse(raw) : {};
        var pref = window.localStorage.getItem('arupos_v1_theme_pref');
        var sTheme = s && (s.theme === 'light' || s.theme === 'dark' || s.theme === 'system') ? s.theme : null;
        var themeMode = sTheme || (pref === 'light' || pref === 'dark' || pref === 'system' ? pref : 'light');
        var resolvedTheme = themeMode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (themeMode === 'dark' ? 'dark' : 'light');
        var accent = (s && (s.accent === 'emerald' || s.accent === 'amber' || s.accent === 'burgundy' || s.accent === 'sapphire'))
          ? s.accent
          : 'emerald';
        var lang = (s && (s.language === 'en' || s.language === 'id')) ? s.language : 'id';
        var root = document.documentElement;
        root.lang = lang;
        root.setAttribute('data-theme', resolvedTheme);
        root.style.colorScheme = resolvedTheme;
        root.setAttribute('data-accent', accent);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon.svg">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/animations.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-wrap">
        <img src="./assets/icon.svg" alt="Logo AruPOS" class="brand-logo" width="38" height="38">
        <div class="store-title-wrap">
          <h1 id="topbar-store-name" class="store-name">AruPOS</h1>
          <p id="topbar-store-sub" class="store-sub">Kasir Digital Offline</p>
        </div>
      </div>
      <div class="top-bar-actions">
        <button
          type="button"
          id="topbar-theme-btn"
          class="icon-btn"
          title="Ganti tema terang atau gelap"
          aria-label="Ganti tema terang atau gelap"
        ></button>
      </div>
    </header>

    <nav class="nav-rail" aria-label="Navigasi utama">
      <button type="button" class="nav-item is-active" data-view="pos" aria-current="page">
        <span class="nav-icon" data-nav-icon="pos"></span>
        <span class="nav-label">Kasir</span>
      </button>
      <button type="button" class="nav-item" data-view="products">
        <span class="nav-icon" data-nav-icon="products"></span>
        <span class="nav-label">Produk</span>
      </button>
      <button type="button" class="nav-item" data-view="history">
        <span class="nav-icon" data-nav-icon="history"></span>
        <span class="nav-label">Riwayat</span>
      </button>
      <button type="button" class="nav-item" data-view="reports">
        <span class="nav-icon" data-nav-icon="reports"></span>
        <span class="nav-label">Laporan</span>
      </button>
      <button type="button" class="nav-item" data-view="settings">
        <span class="nav-icon" data-nav-icon="settings"></span>
        <span class="nav-label">Setelan</span>
      </button>
    </nav>

    <main class="main-content" id="main-content">
      <section id="view-pos" class="view is-active" data-view-panel="pos" aria-label="Kasir"></section>
      <section id="view-products" class="view" data-view-panel="products" aria-label="Produk"></section>
      <section id="view-history" class="view" data-view-panel="history" aria-label="Riwayat"></section>
      <section id="view-reports" class="view" data-view-panel="reports" aria-label="Laporan"></section>
      <section id="view-settings" class="view" data-view-panel="settings" aria-label="Pengaturan"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navigasi bawah">
      <button type="button" class="nav-item is-active" data-view="pos" aria-current="page">
        <span class="nav-icon" data-nav-icon="pos"></span>
        <span class="nav-label">Kasir</span>
      </button>
      <button type="button" class="nav-item" data-view="products">
        <span class="nav-icon" data-nav-icon="products"></span>
        <span class="nav-label">Produk</span>
      </button>
      <button type="button" class="nav-item" data-view="history">
        <span class="nav-icon" data-nav-icon="history"></span>
        <span class="nav-label">Riwayat</span>
      </button>
      <button type="button" class="nav-item" data-view="reports">
        <span class="nav-icon" data-nav-icon="reports"></span>
        <span class="nav-label">Laporan</span>
      </button>
      <button type="button" class="nav-item" data-view="settings">
        <span class="nav-icon" data-nav-icon="settings"></span>
        <span class="nav-label">Setelan</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="print-receipt-area" aria-hidden="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
